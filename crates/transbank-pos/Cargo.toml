[package]
name = "transbank-pos"
description = "Unofficial Rust SDK for Transbank POS terminals (POS Integrado / Autoservicio) over serial or TCP"
readme = "README.md"
keywords = ["transbank", "pos", "chile", "payments", "serial"]
categories = ["api-bindings", "hardware-support", "finance"]
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE", "NOTICE"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["serial"]
serial = ["dep:serialport"]
serde = ["dep:serde"]
tracing = ["dep:tracing"]

[dependencies]
thiserror.workspace = true
serialport = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
